# 前后端一体一键部署：
#   1) cp .env.docker.example .env   # 并修改其中的密钥
#   2) docker compose up -d --build
#   3) 打开 http://localhost:8080
#
# 前端经 nginx 提供静态资源，并把 /api 反代到 server 容器（同源，无 CORS）。
# 只需要纯前端静态部署时不需要本文件，直接 `docker build -t chat-web . && docker run -p 8080:80 chat-web`。

services:
  server:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 3000
      # 会话签名密钥：必填，随机长字符串（openssl rand -hex 32）
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      # API Key 加密密钥：必填，32 字节 hex（openssl rand -hex 32）
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请在 .env 中设置 ENCRYPTION_KEY}
      # 同源部署下浏览器不发跨域请求，此值仅作兜底
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LLM_RATE_WINDOW_MS: ${LLM_RATE_WINDOW_MS:-60000}
      LLM_RATE_MAX: ${LLM_RATE_MAX:-30}
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_USE_LOCAL_DATA: 'false'
        VITE_WEBUI_BASE_URL: '' # 同源：请求发往当前站点，由 nginx 反代到 server
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ./nginx.fullstack.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
